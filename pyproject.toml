[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering"
version = "0.2.0"
description = "Deterministic control-plane for bounded software-quality loops."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = [
    "quality-assurance",
    "langgraph",
    "django",
    "react",
    "github-actions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=6.0,<7",
    "jsonschema>=4.23,<5",
    "langgraph>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/hooman61/loop-engineering"
Documentation = "https://github.com/hooman61/loop-engineering#readme"
Issues = "https://github.com/hooman61/loop-engineering/issues"
Repository = "https://github.com/hooman61/loop-engineering"

[project.scripts]
loop-inspect = "loop_engineering.cli:main"
loop-engineering = "loop_engineering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
schemas = ["schemas/inspection-profile.schema.json"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
